[project]
name = "salesforce-dbx-deal-automation"
version = "0.2.0"
description = "Rules-driven Salesforce to Databricks deal registration workflow"
requires-python = ">=3.11,<3.13"
dependencies = [
  "streamlit>=1.38,<2",
  "pandas>=2.2,<3",
  "python-dotenv>=1,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
