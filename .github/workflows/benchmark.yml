name: Benchmark

on:
  push:
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
    inputs:
      deals:
        description: "Synthetic Salesforce deals"
        required: true
        default: "1000"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Run benchmark
        env:
          BENCHMARK_DEALS: ${{ inputs.deals || '1000' }}
          BENCHMARK_OUT: benchmark-results
        run: python benchmarks/run_benchmark.py
      - name: Publish benchmark summary
        run: |
          echo '## Salesforce → Databricks benchmark' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/results.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-benchmark-${{ inputs.deals || '1000' }}-deals
          path: benchmark-results/
